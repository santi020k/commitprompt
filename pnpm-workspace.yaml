packages:
  - "packages/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  yarn: set this to true or false

allowedDeprecatedVersions:
  node-domexception: 1.0.0

catalog:
  "@axe-core/playwright": ^4.12.1
  "@playwright/test": ^1.62.0
  "@astrojs/check": ^0.9.10
  "@astrojs/sitemap": ^3.7.3
  "@changesets/changelog-github": ^0.7.0
  "@changesets/cli": ^2.31.1
  "@commitlint/cli": ^21.2.1
  "@commitlint/config-conventional": ^21.2.0
  "@commitlint/lint": ^21.2.0
  "@commitlint/load": ^21.2.0
  "@commitlint/types": ^21.2.0
  "@santi020k/eslint-config-astro": ^3.1.0
  "@santi020k/eslint-config-basic": ^3.2.0
  "@santi020k/eslint-config-extensions": ^3.1.0
  "@santi020k/eslint-config-formats": ^3.1.0
  "@santi020k/eslint-config-libraries": ^3.1.0
  "@santi020k/eslint-config-testing": ^3.1.0
  "@santi020k/eslint-config-tools": ^3.1.0
  "@santi020k/lumen-astro": ^0.4.0
  "@types/node": ^26.1.2
  "@vitest/coverage-v8": ^4.1.10
  astro: ^7.1.4
  cspell: ^10.0.1
  eslint: ^10.8.0
  husky: ^9.1.7
  jsonc-parser: ^3.3.1
  knip: ^6.29.0
  lint-staged: ^17.2.0
  publint: ^0.3.22
  sharp: ^0.35.3
  turbo: ^2.10.7
  typescript: ^6.0.3
  vitest: ^4.1.10
  wrangler: ^4.114.0
  yarn: ^1.22.22

minimumReleaseAgeExclude:
  - '@santi020k/eslint-config-basic@3.2.0'
  - '@santi020k/eslint-config-typescript'

overrides:
  glob@10.5.0: 13.0.6
