  jsonc-parser: ^3.3.1
  knip: ^6.32.2
  lint-staged: ^17.2.0
  publint: ^0.3.22
  sharp: ^0.35.3
  turbo: ^2.10.11
  typescript: ^6.0.3
  vitest: ^4.1.10
  wrangler: ^4.114.0
  yarn: ^1.22.22

minimumReleaseAgeExclude:
