  lint-staged: ^16.4.0
  publint: ^0.3.25
  turbo: ^2.11.7
  typescript: ^6.0.3
  vitest: ^5.0.3
  wrangler: ^4.148.0
  yaml: ^2.9.1
  yarn: ^1.22.22

minimumReleaseAgeExclude:
  - "@santi020k/og"
  - "@santi020k/lumen-astro@4.1.0"
