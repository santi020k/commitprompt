  glob@>=9 <14.0.2: 14.0.6
  minimatch@>=7 <11.0.1: 11.0.9
  eslint-plugin-import-x@4: 4.18.1
  "micromark-extension-math>katex": 0.19.0
  "miniflare>sharp": 0.35.5
  "satori>fflate": 0.7.5
  oxlint: 1.87.0
  storybook@>=10.0.0 <10.6.3: 10.6.3
  zod@>=4.0.0 <4.6.7: 4.6.7
  undici@>=7.0.0 <7.30.1: 7.30.1
  undici@>=8.0.0 <8.12.3: 8.12.3
  fast-uri@>=3.0.0 <3.1.9: 3.1.9

packageExtensions:
