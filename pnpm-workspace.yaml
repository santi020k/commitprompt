  "micromark-extension-math>katex": 0.19.0
  "miniflare>sharp": 0.35.5
  "satori>fflate": 0.7.5
  oxlint: 1.87.0
  storybook@>=10.0.0 <10.6.3: 10.6.3
  zod@>=4.0.0 <4.6.7: 4.6.7
  undici@>=7.0.0 <7.30.1: 7.30.1
