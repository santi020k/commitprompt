name: Dependency audit

# CI blocks every validation run on a fresh audit; this workflow monitors advisories between changes.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      # The audit reads only the lockfile, so dependencies are not installed.
      - name: Set up pnpm
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
          cache: "false"
          install: "false"
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
