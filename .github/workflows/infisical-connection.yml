name: Infisical Connection Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/infisical-connection.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify Infisical OIDC
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          response=$(curl --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/santi020k")
          token=$(jq --raw-output '.value' <<<"$response")
          payload=${token#*.}
          payload=${payload%%.*}
          padding=$(( (4 - ${#payload} % 4) % 4 ))
          payload="${payload}$(printf '=%.0s' $(seq 1 "$padding"))"
          printf '%s' "$payload" | tr '_-' '/+' | base64 --decode 2>/dev/null |
            jq '{sub, aud, repository, repository_owner, event_name, ref}'

      - name: Authenticate and fetch development secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /
          recursive: true

      - name: Confirm connection
        run: echo "Infisical OIDC authentication completed successfully."
