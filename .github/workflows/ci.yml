# cspell:words tlsv
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Title and label events are handled by pr-metadata.yml so they never rerun validation.
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Quality v2 shadow plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Quality 2
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/santi020k/quality/ff490e9efbd5fdfbdb1e6c404f1741d04c57f585/install.sh -o "$RUNNER_TEMP/install-quality.sh"
          sh "$RUNNER_TEMP/install-quality.sh" santi020k/quality "v$(cat .quality-version)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Record committed-source plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          args=(--full)
          if [[ "$GITHUB_EVENT_NAME" == pull_request && -n "$BASE" && "$BRANCH" != release/* && "$BRANCH" != changeset-release/* ]]; then
            args=(--base "$BASE" --head HEAD --comparison merge-base)
          fi
          quality impact plan "${args[@]}" --format json > "$RUNNER_TEMP/quality-impact-plan.json"
          cat "$RUNNER_TEMP/quality-impact-plan.json" >> "$GITHUB_STEP_SUMMARY"
          node --test scripts/quality-impact.test.mjs

  changes:
    name: Detect affected areas
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.paths.outputs.mode }}
      docs: ${{ steps.paths.outputs.docs }}
      package: ${{ steps.paths.outputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changed paths
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs

  full:
    name: Validation (22.x)
    outputs:
      artifact-id: ${{ steps.docs-upload.outputs.artifact-id }}
      digest: ${{ steps.docs-evidence.outputs.digest }}
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      # Ordinary pull requests report the live audit through audit.yml without blocking.
      # Release pull requests, pushes, and manual runs keep it as a blocking gate.
      - name: Audit dependencies
        if: >-
          github.event_name != 'pull_request' ||
          startsWith(github.head_ref, 'release/') ||
          startsWith(github.head_ref, 'changeset-release/')
        run: pnpm audit --audit-level moderate
      - name: Resolve the Playwright version
        id: playwright
        shell: bash
        run: |
          version="$(pnpm --filter commitprompt-docs exec playwright --version)"
          version="${version##* }"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore accessibility test browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install accessibility test browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter commitprompt-docs exec playwright install --with-deps chromium
      - name: Install accessibility test browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter commitprompt-docs exec playwright install-deps chromium
      - name: Verify CI selection
        run: pnpm run test:ci
      - name: Run package and documentation checks
        env:
          CI_SCOPE: ${{ needs.changes.outputs.mode }}
        run: |
          scope=()
          if [[ "$CI_SCOPE" == "affected" ]]; then
            scope+=(--filter=commitprompt-docs...)
          fi
          pnpm exec turbo run build typecheck lint test:coverage check:exports "${scope[@]}"
      - name: Run repository checks
        run: pnpm exec turbo run //#lint:repo //#lint:spell //#lint:knip
      - name: Check packed installation
        if: needs.changes.outputs.package == 'true'
        run: pnpm run check:packed-install

      - name: Bind docs build identity
        if: needs.changes.outputs.docs == 'true'
        id: docs-evidence
        run: node scripts/docs-artifact.mjs create
      - name: Save validated documentation
        if: needs.changes.outputs.docs == 'true'
        id: docs-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: docs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/docs/dist/
            apps/docs/build-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  compatibility:
    name: Package compatibility (24.x)
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 24.x
      - name: Build, typecheck, and test the package
        run: pnpm exec turbo run build typecheck test --filter=@santi020k/commitprompt
      - name: Check packed installation
        run: pnpm run check:packed-install

  windows:
    name: Windows package smoke
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      - name: Build, typecheck, and test the package
        run: pnpm exec turbo run build typecheck test --filter=@santi020k/commitprompt --concurrency=1
      - name: Check packed installation
        run: pnpm run check:packed-install

  deploy-docs:
    name: Deploy documentation
    # The site does not depend on the Windows package smoke; the aggregate still requires it.
    needs: [changes, impact, full, compatibility]
    if: >-
      always() &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) &&
      needs.changes.outputs.docs == 'true' &&
      needs.impact.result == 'success' &&
      needs.full.result == 'success' &&
      (needs.changes.outputs.mode == 'full' || needs.changes.outputs.package == 'true') &&
      needs.compatibility.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: docs-production
      url: https://commitprompt.santi020k.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      - name: Restore validated documentation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.full.outputs.artifact-id }}
          path: apps/docs
          merge-multiple: true
      - name: Verify documentation identity
        run: node scripts/docs-artifact.mjs verify
        env:
          DOCS_BUILD_DIGEST: ${{ needs.full.outputs.digest }}
      - name: Fetch production secrets
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /
          recursive: true
      - name: Deploy validated documentation
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'commitprompt' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler pages deploy apps/docs/dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      - name: Verify deployed documentation
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://commitprompt.santi020k.com' }}
        run: |
          for path in / /docs/ /sitemap-index.xml; do
            echo "Checking deployed documentation: $path"
            response="$(mktemp)"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "${PUBLIC_SITE_URL%/}${path}" --output "$response"
            if [[ "$path" == /sitemap-index.xml ]]; then
              grep -q '<sitemapindex' "$response"
            else
              grep -q '<title>[^<]*Commitprompt' "$response"
            fi
            rm "$response"
          done

  gate:
    name: Required checks
    if: always()
    needs: [changes, impact, full, compatibility, windows, deploy-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify relevant jobs
        env:
          IMPACT: ${{ needs.impact.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          PACKAGE: ${{ needs.changes.outputs.package }}
          DOCS: ${{ needs.changes.outputs.docs }}
          CHANGES: ${{ needs.changes.result }}
          FULL: ${{ needs.full.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          WINDOWS: ${{ needs.windows.result }}
          DEPLOY: ${{ needs.deploy-docs.result }}
        run: |
          for result in "$IMPACT" "$CHANGES" "$FULL" "$COMPATIBILITY" "$WINDOWS" "$DEPLOY"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done

          [[ "$IMPACT" == success && "$CHANGES" == success && "$FULL" == success ]] || exit 1
          [[ "$MODE" == full || "$MODE" == affected ]] || exit 1
          [[ "$PACKAGE" == true || "$PACKAGE" == false ]] || exit 1
          [[ "$DOCS" == true || "$DOCS" == false ]] || exit 1
          if [[ "$MODE" == full || "$PACKAGE" == true ]]; then
            [[ "$COMPATIBILITY" == success && "$WINDOWS" == success ]] || exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request && "$DOCS" == true ]]; then
            [[ "$DEPLOY" == success ]] || exit 1
          fi

  report-dispatched-validation:
    name: Report dispatched validation
    if: github.event_name == 'workflow_dispatch'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Report successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context='Required checks'
          -f description='Dispatched release validation passed'
