name: ESLint config maintenance

on:
  pull_request:
    paths:
      - .github/workflows/eslint-config-maintenance.yml
      - '**/eslint.config.*'
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify ESLint config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
      - name: Check compatibility
        run: pnpm exec basic-eslint compatibility
      - name: Check config declaration portability
        run: pnpm exec basic-eslint config-types
      - name: Capture Doctor report
        run: pnpm exec basic-eslint doctor --json > .eslint-config-doctor.json
      - name: Check committed snapshot when present
        run: |
          if [ -f .eslint-config-snapshot.json ]; then
            pnpm exec basic-eslint snapshot --check
          fi
      - name: Upload Doctor report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eslint-config-doctor
          path: .eslint-config-doctor.json
          include-hidden-files: true
          if-no-files-found: warn
