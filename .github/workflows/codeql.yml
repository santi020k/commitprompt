name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "scripts/**"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.json"
      - "**/*.jsonc"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "scripts/**"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.ts"
      - "**/*.json"
      - "**/*.jsonc"
      - "pnpm-lock.yaml"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "21 7 1 * *"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:javascript-typescript
