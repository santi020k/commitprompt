cli:
  - changed-files:
      - any-glob-to-any-file: "packages/commitprompt/**"

docs:
  - changed-files:
      - any-glob-to-any-file: "apps/docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package.json"
          - "packages/*/package.json"
          - "apps/*/package.json"
          - "pnpm-lock.yaml"
          - "pnpm-workspace.yaml"
